name: Build Android APK/AAB

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_PROJECT_ID: "uzccsguniafwnedlpsmg"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6Y2NzZ3VuaWFmd25lZGxwc21nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMDQzOTQsImV4cCI6MjA5ODU4MDM5NH0.twtoMlF7yHo2af3NCwdyRJTSj2MN_3vhfJ29TGSbjCk"
          VITE_SUPABASE_URL: "https://c--db2a9864-11eb-49a0-8d48-e654e736409e-prod.lovable.cloud"
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK (Debug)
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Configure Android signing
        working-directory: ./android
        run: |
          if [ -n "${{ secrets.PLAY_CONSOLE_KEYSTORE }}" ]; then
            echo "Using keystore from secrets"
            echo "${{ secrets.PLAY_CONSOLE_KEYSTORE }}" | base64 --decode > release.keystore
            echo "storePassword=${{ secrets.PLAY_CONSOLE_KEYSTORE_PASSWORD }}" > keystore.properties
            echo "keyPassword=${{ secrets.PLAY_CONSOLE_KEY_PASSWORD }}" >> keystore.properties
            echo "keyAlias=${{ secrets.PLAY_CONSOLE_KEY_ALIAS }}" >> keystore.properties
            echo "storeFile=../release.keystore" >> keystore.properties
          else
            echo "No keystore secret found, generating a temporary one for testing"
            keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown"
            echo "storePassword=password" > keystore.properties
            echo "keyPassword=password" >> keystore.properties
            echo "keyAlias=release" >> keystore.properties
            echo "storeFile=../release.keystore" >> keystore.properties
          fi

      - name: Build AAB (Release)
        working-directory: ./android
        run: ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
