name: Build Android APK/AAB

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_PROJECT_ID: "uzccsguniafwnedlpsmg"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6Y2NzZ3VuaWFmd25lZGxwc21nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMDQzOTQsImV4cCI6MjA5ODU4MDM5NH0.twtoMlF7yHo2af3NCwdyRJTSj2MN_3vhfJ29TGSbjCk"
          VITE_SUPABASE_URL: "https://c--db2a9864-11eb-49a0-8d48-e654e736409e-prod.lovable.cloud"
          SUPABASE_URL: "https://c--db2a9864-11eb-49a0-8d48-e654e736409e-prod.lovable.cloud"
          SUPABASE_SERVICE_ROLE_KEY: "dummy"
          SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV6Y2NzZ3VuaWFmd25lZGxwc21nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMDQzOTQsImV4cCI6MjA5ODU4MDM5NH0.twtoMlF7yHo2af3NCwdyRJTSj2MN_3vhfJ29TGSbjCk"
        run: npm run build

      - name: Sync Capacitor
        run: |
          npx cap sync android
          test -f .output/public/index.html
          test -f android/app/src/main/assets/public/index.html

      - name: Configure Android signing
        working-directory: ./android
        env:
          PLAY_CONSOLE_KEYSTORE: ${{ secrets.PLAY_CONSOLE_KEYSTORE }}
          PLAY_CONSOLE_KEYSTORE_PASSWORD: ${{ secrets.PLAY_CONSOLE_KEYSTORE_PASSWORD }}
          PLAY_CONSOLE_KEY_ALIAS: ${{ secrets.PLAY_CONSOLE_KEY_ALIAS }}
          PLAY_CONSOLE_KEY_PASSWORD: ${{ secrets.PLAY_CONSOLE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(PLAY_CONSOLE_KEYSTORE PLAY_CONSOLE_KEYSTORE_PASSWORD PLAY_CONSOLE_KEY_ALIAS PLAY_CONSOLE_KEY_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: ${name}"
              echo "Configure PLAY_CONSOLE_KEYSTORE, PLAY_CONSOLE_KEYSTORE_PASSWORD, PLAY_CONSOLE_KEY_ALIAS, and PLAY_CONSOLE_KEY_PASSWORD before running a release build."
              exit 1
            fi
          done
          printf '%s' "$PLAY_CONSOLE_KEYSTORE" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storePassword=$PLAY_CONSOLE_KEYSTORE_PASSWORD
          keyPassword=$PLAY_CONSOLE_KEY_PASSWORD
          keyAlias=$PLAY_CONSOLE_KEY_ALIAS
          storeFile=../release.keystore
          EOF
          chmod 600 release.keystore keystore.properties

      - name: Build APK (Debug)
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build AAB (Release)
        working-directory: ./android
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify signed AAB
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
